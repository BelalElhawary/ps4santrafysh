<!doctype html>
<html lang="en" manifest="cache.appcache">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Santrafysh</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #0b0d10;
      color: #c8ced8;
      font:
        15px/1.45 "Segoe UI",
        system-ui,
        sans-serif;
    }

    html {
      background: #0b0d10;
      background: #0b0d10
        -webkit-radial-gradient(
          50% 0%,
          circle,
          rgba(127, 208, 160, 0.12),
          rgba(11, 13, 16, 0) 65%
        )
        no-repeat fixed;
      background: #0b0d10
        radial-gradient(
          circle at 50% 0%,
          rgba(127, 208, 160, 0.12),
          rgba(11, 13, 16, 0) 65%
        )
        no-repeat fixed;
    }

    body {
      background: transparent;
    }

    #brand {
      text-align: center;
      padding: 12px 10px;
      background: #0e1116;
      background: -webkit-linear-gradient(top, #141a22, #0e1116);
      background: linear-gradient(to bottom, #141a22, #0e1116);
      border-bottom: 1px solid #1e2732;
      box-shadow:
        0 1px 0 rgba(127, 208, 160, 0.18),
        0 6px 18px rgba(0, 0, 0, 0.35);
    }

    #brand img {
      width: 28px;
      height: 28px;
      margin-right: 8px;
      border-radius: 50%;
      vertical-align: middle;
    }

    #brand b {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #e6ebf2;
      text-shadow: 0 0 14px rgba(127, 208, 160, 0.45);
      vertical-align: middle;
    }

    #credits {
      margin-top: 4px;
      font-size: 11px;
      color: #5c6672;
    }

    #credits a {
      color: #8b95a3;
      text-decoration: none;
      border-bottom: 1px dotted #3a444f;
    }

    #credits a:hover,
    #credits a:focus {
      color: #c8ced8;
    }

    /* running: a spinner under the brand. jb.js sets body.done / body.fail / body.log. */
    #spin {
      position: fixed;
      top: calc(50% + 20px);
      left: 50%;
      width: 52px;
      height: 52px;
      margin: -26px 0 0 -26px;
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
      border: 4px solid #1e2732;
      border-top-color: #7fd0a0;
      border-radius: 50%;
      box-shadow: 0 0 18px rgba(127, 208, 160, 0.18);
      -webkit-animation: spin 0.9s linear infinite;
      animation: spin 0.9s linear infinite;
    }

    @-webkit-keyframes spin {
      to {
        -webkit-transform: rotate(360deg);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #msg {
      position: fixed;
      top: 50%;
      left: 0;
      right: 0;
      width: 80%;
      max-width: 340px;
      margin: 0 auto;
      padding: 16px 20px;
      -webkit-transform: translateY(-50%);
      transform: translateY(-50%);
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #e6ebf2;
      background: #11151b;
      border: 1px solid #1e2732;
      border-left: 3px solid #d08a7f;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      display: none;
    }

    #wrap {
      padding: 0;
    }

    #state,
    #out {
      display: none;
    }

    body.done #spin {
      display: none;
    }

    body.fail #spin {
      display: none;
    }

    body.fail #msg {
      display: block;
    }

    /* ?log=1 -- the full step log, styled like the landing. */
    body.log #spin,
    body.log #msg {
      display: none;
    }

    body.log #wrap {
      padding: 14px 18px;
    }

    body.log #state {
      display: block;
      font-size: 22px;
      line-height: 30px;
      font-weight: 700;
      color: #e6ebf2;
      margin: 0 0 10px;
    }

    body.log #state.ok {
      color: #7fd0a0;
    }

    body.log #state.bad {
      color: #d08a7f;
    }

    body.log #state.warn {
      color: #d8c07f;
    }

    body.log #out {
      display: block;
      white-space: pre-wrap;
      font:
        12px/1.5 Consolas,
        monospace;
      background: #0d1116;
      border: 1px solid #1e2732;
      border-radius: 8px;
      box-shadow:
        inset 0 2px 10px rgba(0, 0, 0, 0.4),
        0 6px 20px rgba(0, 0, 0, 0.35);
      padding: 10px 12px;
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
      /* 100vh - brand (~43px) - wrap padding (28px) - #state (40px), plus a little slack */
      height: calc(100vh - 118px);
      overflow-y: auto;
    }

    .ok {
      color: #7fd0a0;
    }

    .bad {
      color: #d08a7f;
    }

    .warn {
      color: #d8c07f;
    }

    .safe {
      color: #7fd0a0;
    }

    .danger {
      color: #d08a7f;
    }

    code {
      color: #9fb3d0;
    }
  </style>
</head>

<body>
  <div id="brand"><b>Santrafysh</b>
    <div id="credits">by santrafysh &middot; built on <a href="https://github.com/raw13g/raw13g.github.io" target="_blank" rel="noopener">raw-games</a> &amp; <a href="https://github.com/mansoor0x/polpNO" target="_blank" rel="noopener">mansoor0x</a></div>
  </div>
  <div id="spin"></div>
  <div id="msg">Restart your console</div>
  <div id="wrap">
    <div id="state"></div>
    <div id="out"></div>
  </div>
  <script type="module">
    import "./jb.js?v=10";
  </script>
</body>

</html>
