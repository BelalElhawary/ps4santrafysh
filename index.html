<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Santrafysh</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: #0b0d10;
            color: #c8ced8;
            font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
        }

        html {
            background: #0b0d10;
            background: #0b0d10 -webkit-radial-gradient(50% 0%, circle, rgba(127, 208, 160, .12), rgba(11, 13, 16, 0) 65%) no-repeat fixed;
            background: #0b0d10 radial-gradient(circle at 50% 0%, rgba(127, 208, 160, .12), rgba(11, 13, 16, 0) 65%) no-repeat fixed;
        }

        body {
            background: transparent;
        }

        #brand {
            text-align: center;
            padding: 12px 10px;
            background: #0e1116;
            background: -webkit-linear-gradient(top, #141a22, #0e1116);
            background: linear-gradient(to bottom, #141a22, #0e1116);
            border-bottom: 1px solid #1e2732;
            box-shadow: 0 1px 0 rgba(127, 208, 160, .18), 0 6px 18px rgba(0, 0, 0, .35);
        }

        #brand img {
            width: 28px;
            height: 28px;
            margin-right: 8px;
            border-radius: 50%;
            vertical-align: middle;
        }

        #brand b {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .32em;
            text-transform: uppercase;
            color: #e6ebf2;
            text-shadow: 0 0 14px rgba(127, 208, 160, .45);
            vertical-align: middle;
        }

        #credits {
            margin-top: 4px;
            font-size: 11px;
            color: #5c6672;
        }

        #credits a {
            color: #8b95a3;
            text-decoration: none;
            border-bottom: 1px dotted #3a444f;
        }

        #credits a:hover,
        #credits a:focus {
            color: #c8ced8;
        }

        #wrap {
            max-width: 460px;
            margin: 28px auto;
            padding: 20px 22px 18px;
            background: #11151b;
            border: 1px solid #1e2732;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
        }

        #state {
            font-size: 22px;
            line-height: 30px;
            font-weight: 700;
            color: #e6ebf2;
            margin: 0 0 8px;
        }

        #state.ok {
            color: #7fd0a0;
        }

        #state.bad {
            color: #d08a7f;
        }

        #state.warn {
            color: #d8c07f;
        }

        #det {
            font-size: 13px;
            color: #8b95a3;
            margin: 0 0 12px;
        }

        #det b {
            color: #c8ced8;
            font-weight: 600;
        }

        #cache {
            font-size: 12px;
            color: #5c6672;
            margin: 0;
            padding-top: 12px;
            border-top: 1px solid #1e2732;
            min-height: 16px;
        }

        #cache:empty:before {
            display: none;
        }

        #cache:before {
            content: "";
            display: inline-block;
            width: 7px;
            height: 7px;
            margin-right: 8px;
            border-radius: 50%;
            background: #3a444f;
            vertical-align: middle;
        }

        #cache.cacheok {
            color: #7fd0a0;
        }

        #cache.cacheok:before {
            background: #7fd0a0;
            box-shadow: 0 0 8px rgba(127, 208, 160, .7);
        }

        #manual {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #1e2732;
            display: none;
        }

        #manual.show {
            display: block;
        }

        #manualLabel {
            font-size: 12px;
            color: #5c6672;
            margin: 0 0 8px;
        }

        #fwbtns {
            display: -webkit-box;
            display: flex;
            flex-wrap: wrap;
            -webkit-flex-wrap: wrap;
            gap: 6px;
        }

        .fwbtn {
            font: 12px/1 "Segoe UI", system-ui, sans-serif;
            padding: 7px 10px;
            margin: 0 6px 6px 0;
            color: #c8ced8;
            background: #171c24;
            border: 1px solid #2a3441;
            border-radius: 5px;
        }

        .fwbtn.unmeasured {
            color: #8b95a3;
            border-style: dashed;
        }

        .fwbtn.current {
            color: #7fd0a0;
            border-color: #3a6b52;
            background: #142019;
        }

        .ok {
            color: #7fd0a0;
        }

        .bad {
            color: #d08a7f;
        }

        .warn {
            color: #d8c07f;
        }
    </style>
</head>

<body>
    <div id="brand"><b>Santrafysh</b>
        <div id="credits">by santrafysh &middot; built on <a href="https://github.com/raw13g/raw13g.github.io" target="_blank" rel="noopener">raw-games</a> &amp; <a href="https://github.com/mansoor0x/polpNO" target="_blank" rel="noopener">mansoor0x</a></div>
    </div>
    <div id="wrap">
        <div id="state">detecting firmware...</div>
        <div id="det"></div>
        <div id="cache"></div>
        <div id="manual">
            <div id="manualLabel">or run a specific firmware's offsets manually:</div>
            <div id="fwbtns"></div>
        </div>
    </div>

    <script type="module">
        import { FW_KEYS } from "./ps4_offsets.js";
        (function () {
            var stateEl = document.getElementById("state");
            var detEl = document.getElementById("det");
            var cacheEl = document.getElementById("cache");
            function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
            function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
            var params = new URLSearchParams(location.search);

            // Firmwares this build has a MEASURED kernel table for. jb.js still runs its
            // own kernel-table-present gate, so this is UX only -- an unlisted firmware
            // can still be launched with a tap. KEEP IN SYNC with ps4_offsets.js: add a
            // fwnum here in the SAME commit that fills that firmware's kernel RVAs.
            // The PS4 reports its minor as two hex digits in the UA (13.52 -> minor 0x52).
            var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 }; // all measured on hardware

            var key = null, fwnum = null;
            var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
            if (m) {
                var ms = parseInt(m[2], 16).toString(16);
                if (ms.length < 2) ms = "0" + ms;
                key = m[1] + "." + ms;
                fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
            }

            var forced = params.get("force") === "1";
            var fwParam = params.get("fw");
            var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
            detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
                + (supported ? " &middot; <b>supported</b>"
                    : " &middot; not in this build's kernel table");

            // fwnum for an offsets-table key, using the same hex-as-decimal
            // convention as the UA-sniffed fwnum above (KEEP IN SYNC).
            function fwnumOfKey(k) {
                var p = k.split(".");
                return parseInt(p[0], 10) * 100 + parseInt(p[1], 10);
            }

            var fwbtnsEl = document.getElementById("fwbtns");
            var manualEl = document.getElementById("manual");
            if (fwbtnsEl && manualEl && FW_KEYS && FW_KEYS.length) {
                var autoBtn = document.createElement("button");
                autoBtn.type = "button";
                autoBtn.className = "fwbtn" + (fwParam ? "" : " current");
                autoBtn.textContent = "auto (" + (key || "unknown") + ")";
                autoBtn.title = "detect firmware from this browser's user-agent";
                autoBtn.addEventListener("click", function () {
                    var sp = new URLSearchParams(location.search);
                    sp.delete("fw");
                    location.href = "jb.html?" + sp.toString();
                });
                fwbtnsEl.appendChild(autoBtn);

                FW_KEYS.forEach(function (v) {
                    var measured = SUPPORTED[fwnumOfKey(v)] === 1;
                    var btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "fwbtn"
                        + (v === fwParam ? " current" : "")
                        + (measured ? "" : " unmeasured");
                    btn.textContent = v;
                    btn.title = measured
                        ? "measured on hardware"
                        : "not measured on hardware -- may fail";
                    btn.addEventListener("click", function () {
                        var sp = new URLSearchParams(location.search);
                        sp.set("fw", v);
                        sp.set("force", "1");
                        location.href = "jb.html?" + sp.toString();
                    });
                    fwbtnsEl.appendChild(btn);
                });
                manualEl.className = "show";
            }

            var target = "jb.html" + location.search;
            function go() { setState("loading jailbreak...", "warn"); location.replace(target); }

            function waitForTap(msg, action) {
                setState(msg, "warn");
                function fire() {
                    window.removeEventListener("click", fire);
                    window.removeEventListener("keydown", fire);
                    action();
                }
                window.addEventListener("click", fire);
                window.addEventListener("keydown", fire);
            }

            // Off-target consoles are not launched automatically -- one tap still runs
            // it, so a user-agent quirk on the real 13.52 console can never lock it out.
            if (!supported) {
                setState("UNSUPPORTED FIRMWARE", "bad");
                waitForTap("UNSUPPORTED (" + (key || "unknown") + ") -- press X or tap to run anyway", go);
                return;
            }

            var ac = window.applicationCache;
            if (!ac || !document.documentElement.hasAttribute("manifest")) {
                go();
            } else if (!navigator.onLine) {
                setCache("offline -- from cache", true);
                go();
            } else if (ac.status === ac.IDLE) {
                setCache("cached", true);
                go();
            } else if (ac.status === ac.UPDATEREADY) {
                try { ac.swapCache(); } catch (e) { }
                setCache("update downloaded", true);
                waitForTap("UPDATE READY -- press X or tap to reload & run",
                    function () { location.reload(); });
            } else {
                setCache("checking cache...");
                ac.addEventListener("downloading",
                    function () { setCache("caching for offline (first run)..."); }, false);
                ac.addEventListener("progress", function (e) {
                    if (e && e.total)
                        setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
                }, false);
                ac.addEventListener("cached", function () {
                    setCache("cached for offline use", true);
                    waitForTap("CACHED (first run) -- press X or tap to run", go);
                }, false);
                ac.addEventListener("updateready", function () {
                    try { ac.swapCache(); } catch (e) { }
                    setCache("update downloaded", true);
                    waitForTap("UPDATE READY -- press X or tap to reload & run",
                        function () { location.reload(); });
                }, false);
                ac.addEventListener("noupdate", function () {
                    setCache("cached -- offline ready", true);
                    go();
                }, false);
                ac.addEventListener("error", function () {
                    setCache("cache unavailable");
                    waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
                }, false);
                ac.addEventListener("obsolete", function () {
                    setCache("cache obsolete");
                    waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
                }, false);
            }
        })();
    </script>
</body>

</html>
