<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Santrafysh</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: #0b0d10;
            color: #c8ced8;
            font: 15px/1.45 "Segoe UI", Tahoma, Arial, system-ui, sans-serif;
        }

        html {
            background: #0b0d10;
            background: #0b0d10 -webkit-radial-gradient(50% 0%, circle, rgba(127, 208, 160, .12), rgba(11, 13, 16, 0) 65%) no-repeat fixed;
            background: #0b0d10 radial-gradient(circle at 50% 0%, rgba(127, 208, 160, .12), rgba(11, 13, 16, 0) 65%) no-repeat fixed;
        }

        body {
            background: transparent;
        }

        #brand {
            position: relative;
            text-align: center;
            padding: 12px 10px;
            background: #0e1116;
            background: -webkit-linear-gradient(top, #141a22, #0e1116);
            background: linear-gradient(to bottom, #141a22, #0e1116);
            border-bottom: 1px solid #1e2732;
            box-shadow: 0 1px 0 rgba(127, 208, 160, .18), 0 6px 18px rgba(0, 0, 0, .35);
        }

        #brand img {
            width: 28px;
            height: 28px;
            margin-right: 8px;
            border-radius: 50%;
            vertical-align: middle;
        }

        #brand b {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .32em;
            text-transform: uppercase;
            color: #e6ebf2;
            text-shadow: 0 0 14px rgba(127, 208, 160, .45);
            vertical-align: middle;
        }

        #credits {
            margin-top: 4px;
            font-size: 11px;
            color: #5c6672;
        }

        #credits a {
            color: #8b95a3;
            text-decoration: none;
            border-bottom: 1px dotted #3a444f;
        }

        #credits a:hover,
        #credits a:focus {
            color: #c8ced8;
        }

        #lang {
            position: absolute;
            top: 10px;
            right: 10px;
            font: 12px/1 "Segoe UI", Tahoma, Arial, system-ui, sans-serif;
            padding: 6px 10px;
            color: #c8ced8;
            background: #171c24;
            border: 1px solid #2a3441;
            border-radius: 5px;
        }

        #lang:hover,
        #lang:focus {
            color: #7fd0a0;
            border-color: #3a6b52;
        }

        #wrap {
            max-width: 460px;
            margin: 28px auto;
            padding: 20px 22px 18px;
            background: #11151b;
            border: 1px solid #1e2732;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
        }

        #state {
            font-size: 22px;
            line-height: 30px;
            font-weight: 700;
            color: #e6ebf2;
            margin: 0 0 8px;
        }

        #state.ok {
            color: #7fd0a0;
        }

        #state.bad {
            color: #d08a7f;
        }

        #state.warn {
            color: #d8c07f;
        }

        #det {
            font-size: 13px;
            color: #8b95a3;
            margin: 0 0 12px;
        }

        #det b {
            color: #c8ced8;
            font-weight: 600;
        }

        #cache {
            font-size: 12px;
            color: #5c6672;
            margin: 0;
            padding-top: 12px;
            border-top: 1px solid #1e2732;
            min-height: 16px;
        }

        #cache:empty:before {
            display: none;
        }

        #cache:before {
            content: "";
            display: inline-block;
            width: 7px;
            height: 7px;
            margin-right: 8px;
            border-radius: 50%;
            background: #3a444f;
            vertical-align: middle;
        }

        #cache.cacheok {
            color: #7fd0a0;
        }

        #cache.cacheok:before {
            background: #7fd0a0;
            box-shadow: 0 0 8px rgba(127, 208, 160, .7);
        }

        #tapBtn {
            display: none;
            width: 100%;
            margin-top: 12px;
            padding: 10px 14px;
            font: 13px/1 "Segoe UI", system-ui, sans-serif;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: #0b1a12;
            background: #3fae6f;
            background: -webkit-linear-gradient(top, #7fd0a0, #3fae6f);
            background: linear-gradient(to bottom, #7fd0a0, #3fae6f);
            border: 2px solid #3a6b52;
            border-radius: 6px;
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
        }

        #tapBtn.show {
            display: block;
        }

        #tapBtn:focus {
            outline: none;
            border-color: #b8f0d0;
            box-shadow: 0 0 12px rgba(127, 208, 160, .7);
        }

        #manual {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #1e2732;
            display: none;
        }

        #manual.show {
            display: block;
        }

        #manualLabel {
            font-size: 12px;
            color: #5c6672;
            margin: 0 0 8px;
        }

        #fwbtns {
            display: -webkit-box;
            display: flex;
            flex-wrap: wrap;
            -webkit-flex-wrap: wrap;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            gap: 6px;
        }

        .fwbtn {
            font: 12px/1 "Segoe UI", system-ui, sans-serif;
            padding: 7px 10px;
            margin: 0 6px 6px 0;
            color: #c8ced8;
            background: #171c24;
            border: 1px solid #2a3441;
            border-radius: 5px;
        }

        .fwbtn.unmeasured {
            color: #8b95a3;
            border-style: dashed;
        }

        .fwbtn.current {
            color: #7fd0a0;
            border-color: #3a6b52;
            background: #142019;
        }

        .fwbtn.auto {
            width: 68px;
            height: 68px;
            padding: 0;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.2;
            text-align: center;
            color: #0b1a12;
            background: #3fae6f;
            background: -webkit-linear-gradient(top, #7fd0a0, #3fae6f);
            background: linear-gradient(to bottom, #7fd0a0, #3fae6f);
            border: 2px solid #3a6b52;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(127, 208, 160, .35);
        }

        .fwbtn.auto small {
            display: block;
            font-size: 10px;
            font-weight: 600;
            opacity: .75;
        }

        .fwbtn.auto.current {
            border-color: #b8f0d0;
            box-shadow: 0 0 16px rgba(127, 208, 160, .8);
        }

        .fwbtn.gold {
            color: #f2dfa0;
            border-color: #b8912f;
            background: #211c10;
            box-shadow: 0 0 8px rgba(212, 175, 55, .5), inset 0 0 8px rgba(212, 175, 55, .18);
        }

        .fwbtn.gold.unmeasured {
            color: #d8c48a;
        }

        .fwbtn.gold.current {
            border-color: #f0cf6a;
            box-shadow: 0 0 16px rgba(240, 207, 106, .85), inset 0 0 10px rgba(240, 207, 106, .3);
        }

        .fwbtn.silver {
            color: #d4dae2;
            border-color: #8b95a3;
            background: #171b20;
            box-shadow: 0 0 6px rgba(196, 204, 214, .4), inset 0 0 6px rgba(196, 204, 214, .12);
        }

        .fwbtn.silver.current {
            border-color: #e4e9ef;
            box-shadow: 0 0 12px rgba(228, 233, 239, .7), inset 0 0 8px rgba(228, 233, 239, .25);
        }

        #fwlegend {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #1e2732;
            font-size: 12px;
            color: #8b95a3;
        }

        #fwlegend li {
            margin: 0 0 6px;
            list-style: none;
        }

        #fwlegend li:last-child {
            margin-bottom: 0;
        }

        #fwlegend b {
            color: #c8ced8;
        }

        #fwlegend .swatch {
            display: inline-block;
            width: 10px;
            height: 10px;
            margin-right: 6px;
            border-radius: 3px;
            vertical-align: middle;
        }

        #fwlegend .swatch.gold {
            border: 1px solid #b8912f;
            background: #211c10;
            box-shadow: 0 0 6px rgba(212, 175, 55, .6);
        }

        #fwlegend .swatch.silver {
            border: 1px solid #8b95a3;
            background: #171b20;
            box-shadow: 0 0 6px rgba(196, 204, 214, .5);
        }

        #fwlegend .swatch.auto {
            border: 1px solid #3a6b52;
            background: -webkit-linear-gradient(top, #7fd0a0, #3fae6f);
            background: linear-gradient(to bottom, #7fd0a0, #3fae6f);
            border-radius: 50%;
        }

        .ok {
            color: #7fd0a0;
        }

        .bad {
            color: #d08a7f;
        }

        .warn {
            color: #d8c07f;
        }

        /* Arabic / right-to-left: mirror every physical left/right margin. */
        html[dir="rtl"] #lang {
            right: auto;
            left: 10px;
        }

        html[dir="rtl"] #cache:before {
            margin-right: 0;
            margin-left: 8px;
        }

        html[dir="rtl"] .fwbtn {
            margin: 0 0 6px 6px;
        }

        html[dir="rtl"] #fwlegend .swatch {
            margin-right: 0;
            margin-left: 6px;
        }
    </style>
</head>

<body>
    <div id="brand"><button type="button" id="lang"></button><b>Santrafysh</b>
        <div id="credits"></div>
    </div>
    <div id="wrap">
        <div id="state">detecting firmware...</div>
        <div id="det"></div>
        <div id="cache"></div>
        <button type="button" id="tapBtn"></button>
        <div id="manual">
            <div id="manualLabel"></div>
            <div id="fwbtns"></div>
            <ul id="fwlegend">
                <li><span class="swatch auto"></span><span id="legAuto"></span></li>
                <li><span class="swatch gold"></span><span id="legGold"></span></li>
                <li><span class="swatch silver"></span><span id="legSilver"></span></li>
            </ul>
        </div>
    </div>

    <script type="module">
        import { FW_KEYS } from "./ps4_offsets.js";
        (function () {
            // ---- i18n --------------------------------------------------------
            var STR = {
                en: {
                    dir: "ltr",
                    langBtn: "العربية",
                    langBtnTitle: "Switch to Arabic",
                    credits: "by santrafysh &middot; built on "
                        + "<a href=\"https://github.com/raw13g/raw13g.github.io\" target=\"_blank\" rel=\"noopener\">raw-games</a>"
                        + " &middot; AIO Fix by "
                        + "<a href=\"https://github.com/Al-Azif/ps4-exploit-kpatches\" target=\"_blank\" rel=\"noopener\">Al-Azif</a>",
                    manualLabel: "or run a specific firmware's offsets manually:",
                    legAuto: "<b>auto</b> &mdash; detects your console's firmware from its browser and launches the matching offsets automatically.",
                    legGold: "<b>gold mark</b> &mdash; that firmware runs <b>GoldHEN</b>.",
                    legSilver: "<b>silver mark</b> &mdash; that firmware runs (plain) <b>HEN</b>.",
                    autoWord: "auto",
                    autoTitle: "detect firmware from this browser's user-agent",
                    firmwareLabel: "firmware",
                    unknown: "unknown",
                    supported: "supported",
                    notInTable: "not in this build's kernel table",
                    measured: "measured on hardware",
                    unmeasured: "not measured on hardware -- may fail",
                    detecting: "detecting firmware...",
                    loading: "loading jailbreak...",
                    unsupportedState: "UNSUPPORTED FIRMWARE",
                    unsupportedTap: "UNSUPPORTED ({fw}) -- press X or tap to run anyway",
                    offlineCache: "offline -- from cache",
                    cached: "cached",
                    updateDownloaded: "update downloaded",
                    updateReadyTap: "UPDATE READY -- press X or tap to reload & run",
                    checkingCache: "checking cache...",
                    cachingFirst: "caching for offline (first run)...",
                    cachingPct: "caching {pct}%",
                    cachedOffline: "cached for offline use",
                    cachedTap: "CACHED (first run) -- press X or tap to run",
                    noupdateCache: "cached -- offline ready",
                    cacheUnavailable: "cache unavailable",
                    cacheFailedTap: "CACHE FAILED -- press X or tap to run anyway",
                    cacheObsolete: "cache obsolete",
                    cacheObsoleteTap: "CACHE OBSOLETE -- press X or tap to run",
                    tapRun: "run"
                },
                ar: {
                    dir: "rtl",
                    langBtn: "English",
                    langBtnTitle: "التبديل إلى الإنجليزية",
                    credits: "بواسطة santrafysh &middot; مبني على "
                        + "<a href=\"https://github.com/raw13g/raw13g.github.io\" target=\"_blank\" rel=\"noopener\">raw-games</a>"
                        + " &middot; إصلاح AIO بواسطة "
                        + "<a href=\"https://github.com/Al-Azif/ps4-exploit-kpatches\" target=\"_blank\" rel=\"noopener\">Al-Azif</a>",
                    manualLabel: "أو شغّل تعريفات إصدار برنامج ثابت معيّن يدويًا:",
                    legAuto: "<b>تلقائي</b> &mdash; يكتشف إصدار البرنامج الثابت لجهازك من متصفحه ويشغّل التعريفات المطابقة تلقائيًا.",
                    legGold: "<b>علامة ذهبية</b> &mdash; يعمل هذا الإصدار بنظام <b>GoldHEN</b>.",
                    legSilver: "<b>علامة فضية</b> &mdash; يعمل هذا الإصدار بنظام <b>HEN</b> العادي.",
                    autoWord: "تلقائي",
                    autoTitle: "اكتشاف إصدار البرنامج الثابت من متصفح هذا الجهاز",
                    firmwareLabel: "البرنامج الثابت",
                    unknown: "غير معروف",
                    supported: "مدعوم",
                    notInTable: "غير مدرج في جدول النواة لهذا الإصدار",
                    measured: "تم قياسه على جهاز فعلي",
                    unmeasured: "لم يُقَس على جهاز فعلي -- قد يفشل",
                    detecting: "جارٍ اكتشاف البرنامج الثابت...",
                    loading: "جارٍ تحميل الجيلبريك...",
                    unsupportedState: "برنامج ثابت غير مدعوم",
                    unsupportedTap: "غير مدعوم ({fw}) -- اضغط X أو المس للتشغيل رغم ذلك",
                    offlineCache: "غير متصل -- من الذاكرة المؤقتة",
                    cached: "مخزَّن مؤقتًا",
                    updateDownloaded: "تم تنزيل التحديث",
                    updateReadyTap: "التحديث جاهز -- اضغط X أو المس لإعادة التحميل والتشغيل",
                    checkingCache: "جارٍ التحقق من الذاكرة المؤقتة...",
                    cachingFirst: "جارٍ التخزين المؤقت للعمل دون اتصال (أول تشغيل)...",
                    cachingPct: "جارٍ التخزين المؤقت {pct}%",
                    cachedOffline: "تم التخزين المؤقت للاستخدام دون اتصال",
                    cachedTap: "تم التخزين المؤقت (أول تشغيل) -- اضغط X أو المس للتشغيل",
                    noupdateCache: "مخزَّن مؤقتًا -- جاهز دون اتصال",
                    cacheUnavailable: "الذاكرة المؤقتة غير متوفرة",
                    cacheFailedTap: "فشلت الذاكرة المؤقتة -- اضغط X أو المس للتشغيل رغم ذلك",
                    cacheObsolete: "الذاكرة المؤقتة قديمة",
                    cacheObsoleteTap: "الذاكرة المؤقتة قديمة -- اضغط X أو المس للتشغيل",
                    tapRun: "تشغيل"
                }
            };

            var lang = "en";
            try {
                var saved = localStorage.getItem("santrafysh_lang");
                if (saved === "en" || saved === "ar") lang = saved;
                else if ((navigator.language || "").toLowerCase().indexOf("ar") === 0) lang = "ar";
            } catch (e) { }

            function t(key, p) {
                var s = (STR[lang] && STR[lang][key]) || STR.en[key] || key;
                if (p) {
                    Object.keys(p).forEach(function (k) {
                        var v = p[k];
                        if (v === null || v === undefined) v = t("unknown");
                        s = s.split("{" + k + "}").join(v);
                    });
                }
                return s;
            }

            var stateEl = document.getElementById("state");
            var detEl = document.getElementById("det");
            var cacheEl = document.getElementById("cache");
            var tapBtn = document.getElementById("tapBtn");
            var creditsEl = document.getElementById("credits");
            var langBtn = document.getElementById("lang");
            var manualLabelEl = document.getElementById("manualLabel");
            var legAutoEl = document.getElementById("legAuto");
            var legGoldEl = document.getElementById("legGold");
            var legSilverEl = document.getElementById("legSilver");

            var curStateKey = "detecting", curStateParams = null, curStateClass = null;
            var curCacheKey = null, curCacheParams = null, curCacheOk = false;
            var tapActive = false;

            function setState(key, cls, p) {
                curStateKey = key; curStateClass = cls; curStateParams = p;
                stateEl.textContent = t(key, p);
                stateEl.className = cls || "";
            }
            function setCache(key, ok, p) {
                curCacheKey = key; curCacheOk = ok; curCacheParams = p;
                cacheEl.textContent = key ? t(key, p) : "";
                cacheEl.className = ok ? "cacheok" : "";
            }

            function applyLang() {
                document.documentElement.lang = lang;
                document.documentElement.dir = STR[lang].dir;
                if (langBtn) {
                    langBtn.textContent = t("langBtn");
                    langBtn.title = t("langBtnTitle");
                }
                creditsEl.innerHTML = t("credits");
                manualLabelEl.textContent = t("manualLabel");
                legAutoEl.innerHTML = t("legAuto");
                legGoldEl.innerHTML = t("legGold");
                legSilverEl.innerHTML = t("legSilver");
                renderDet();
                buildFwButtons();
                stateEl.textContent = t(curStateKey, curStateParams);
                stateEl.className = curStateClass || "";
                cacheEl.textContent = curCacheKey ? t(curCacheKey, curCacheParams) : "";
                cacheEl.className = curCacheOk ? "cacheok" : "";
                if (tapBtn) tapBtn.textContent = t("tapRun");
            }

            if (langBtn) {
                langBtn.addEventListener("click", function () {
                    lang = lang === "en" ? "ar" : "en";
                    try { localStorage.setItem("santrafysh_lang", lang); } catch (e) { }
                    applyLang();
                });
            }

            var params = new URLSearchParams(location.search);

            // Firmwares this build has a MEASURED kernel table for. jb.js still runs its
            // own kernel-table-present gate, so this is UX only -- an unlisted firmware
            // can still be launched with a tap. KEEP IN SYNC with ps4_offsets.js: add a
            // fwnum here in the SAME commit that fills that firmware's kernel RVAs.
            // The PS4 reports its minor as two hex digits in the UA (13.52 -> minor 0x52).
            var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 }; // all measured on hardware

            var key = null, fwnum = null;
            var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
            if (m) {
                var ms = parseInt(m[2], 16).toString(16);
                if (ms.length < 2) ms = "0" + ms;
                key = m[1] + "." + ms;
                fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
            }

            var forced = params.get("force") === "1";
            var fwParam = params.get("fw");
            var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
            function renderDet() {
                detEl.innerHTML = t("firmwareLabel") + " <b>" + (key || t("unknown")) + "</b>"
                    + (supported ? " &middot; <b>" + t("supported") + "</b>"
                        : " &middot; " + t("notInTable"));
            }

            // fwnum for an offsets-table key, using the same hex-as-decimal
            // convention as the UA-sniffed fwnum above (KEEP IN SYNC).
            function fwnumOfKey(k) {
                var p = k.split(".");
                return parseInt(p[0], 10) * 100 + parseInt(p[1], 10);
            }

            // Firmwares 11.xx-13.xx run GoldHEN, except these which only have plain HEN.
            // KEEP IN SYNC with the actual plugin support for each build.
            var HEN_ONLY = {};
            function isGoldhen(v) {
                var n = fwnumOfKey(v);
                return n >= 1100 && n <= 1399 && HEN_ONLY[n] !== 1;
            }

            var fwbtnsEl = document.getElementById("fwbtns");
            var manualEl = document.getElementById("manual");
            function buildFwButtons() {
                if (!(fwbtnsEl && manualEl && FW_KEYS && FW_KEYS.length)) return;
                fwbtnsEl.innerHTML = "";

                var autoBtn = document.createElement("button");
                autoBtn.type = "button";
                autoBtn.className = "fwbtn auto" + (fwParam ? "" : " current");
                autoBtn.innerHTML = t("autoWord") + "<small>" + (key || t("unknown")) + "</small>";
                autoBtn.title = t("autoTitle");
                autoBtn.addEventListener("click", function () {
                    var sp = new URLSearchParams(location.search);
                    sp.delete("fw");
                    location.href = "jb.html?" + sp.toString();
                });
                fwbtnsEl.appendChild(autoBtn);

                FW_KEYS.slice().reverse().forEach(function (v) {
                    var measured = SUPPORTED[fwnumOfKey(v)] === 1;
                    var gold = isGoldhen(v);
                    var btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "fwbtn"
                        + (v === fwParam ? " current" : "")
                        + (measured ? "" : " unmeasured")
                        + (gold ? " gold" : " silver");
                    btn.textContent = v;
                    btn.title = (measured ? t("measured") : t("unmeasured"))
                        + " -- " + (gold ? "GoldHEN" : "HEN");
                    btn.addEventListener("click", function () {
                        var sp = new URLSearchParams(location.search);
                        sp.set("fw", v);
                        sp.set("force", "1");
                        location.href = "jb.html?" + sp.toString();
                    });
                    fwbtnsEl.appendChild(btn);
                });
                manualEl.className = "show";
            }
            applyLang();

            var target = "jb.html" + location.search;
            function go() { setState("loading", "warn"); location.replace(target); }

            // Only a real <button> triggers the jailbreak now -- a native button's
            // "click" event already fires for mouse clicks, touch taps, and Enter/Space
            // on a focused element, which is how the PS4/PS3 browser reports the X
            // button on whatever control currently has focus. Autofocusing the button
            // means X works immediately, with no accidental screen-tap launches.
            function waitForTap(key, action, p) {
                setState(key, "warn", p);
                if (!tapBtn) return;
                tapBtn.textContent = t("tapRun");
                tapBtn.className = "show";
                tapActive = true;
                function fire() {
                    tapBtn.removeEventListener("click", fire);
                    tapBtn.className = "";
                    tapActive = false;
                    action();
                }
                tapBtn.addEventListener("click", fire);
                try { tapBtn.focus(); } catch (e) { }
            }

            // Off-target consoles are not launched automatically -- one tap still runs
            // it, so a user-agent quirk on the real 13.52 console can never lock it out.
            if (!supported) {
                setState("unsupportedState", "bad");
                waitForTap("unsupportedTap", go, { fw: key });
                return;
            }

            var ac = window.applicationCache;
            if (!ac || !document.documentElement.hasAttribute("manifest")) {
                go();
            } else if (!navigator.onLine) {
                setCache("offlineCache", true);
                go();
            } else if (ac.status === ac.IDLE) {
                setCache("cached", true);
                go();
            } else if (ac.status === ac.UPDATEREADY) {
                try { ac.swapCache(); } catch (e) { }
                setCache("updateDownloaded", true);
                waitForTap("updateReadyTap", function () { location.reload(); });
            } else {
                setCache("checkingCache");
                ac.addEventListener("downloading",
                    function () { setCache("cachingFirst"); }, false);
                ac.addEventListener("progress", function (e) {
                    if (e && e.total)
                        setCache("cachingPct", false, { pct: Math.round((e.loaded / e.total) * 100) });
                }, false);
                ac.addEventListener("cached", function () {
                    setCache("cachedOffline", true);
                    waitForTap("cachedTap", go);
                }, false);
                ac.addEventListener("updateready", function () {
                    try { ac.swapCache(); } catch (e) { }
                    setCache("updateDownloaded", true);
                    waitForTap("updateReadyTap", function () { location.reload(); });
                }, false);
                ac.addEventListener("noupdate", function () {
                    setCache("noupdateCache", true);
                    go();
                }, false);
                ac.addEventListener("error", function () {
                    setCache("cacheUnavailable");
                    waitForTap("cacheFailedTap", go);
                }, false);
                ac.addEventListener("obsolete", function () {
                    setCache("cacheObsolete");
                    waitForTap("cacheObsoleteTap", go);
                }, false);
            }
        })();
    </script>
</body>

</html>
